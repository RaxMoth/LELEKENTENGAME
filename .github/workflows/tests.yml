# Pull requests run what they touch: the unit tests, the smoke test for
# just the areas the changed files belong to (Tools/affected_areas.sh;
# shared code runs everything, docs-only runs no smoke test) and the co-op
# test when co-op code changed. Pushes to main (and a manual run) run
# everything: the full smoke test and the co-op test. See Tools/test.sh.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Keep in sync with the version both developers use (project.godot features).
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4
        with:
          # The base branch too, to see which files a pull request changes.
          fetch-depth: 0

      - name: Install Godot
        run: |
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Tests (pull request: what it touches)
        if: github.event_name == 'pull_request'
        run: Tools/test.sh "origin/${{ github.base_ref }}"

      - name: Tests (everything)
        if: github.event_name != 'pull_request'
        run: Tools/test.sh full

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/test-reports
          if-no-files-found: ignore
