# Runs the unit tests and the headless smoke test on every pull request and
# every push to main. Both must pass before a PR is merged.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Keep in sync with the version both developers use (project.godot features).
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Unit tests
        run: Tools/unit_tests.sh

      - name: Smoke test
        run: Tools/smoke_test.sh

      - name: Co-op test (host + guest over 127.0.0.1)
        run: Tools/coop_test.sh

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/test-reports
          if-no-files-found: ignore
